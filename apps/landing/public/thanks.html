<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9efeb" />
    <title>You’re on the list: Morrow</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <header class="top shell">
      <a class="wordmark" href="/" aria-label="Morrow home">Morrow</a>
      <div class="top-right">
        <a
          class="text-link"
          href="https://github.com/sahil0x01/t1-morrow"
          target="_blank"
          rel="noreferrer"
        >
          GitHub <span aria-hidden="true">↗</span>
        </a>
      </div>
    </header>

    <main class="stage shell">
      <section class="hero">
        <p class="eyebrow">One less thing to remember</p>
        <h1 class="thanks-title">You’re in.</h1>
        <div class="horizon" aria-hidden="true">
          <span class="horizon-line"></span>
          <span class="horizon-glow"></span>
        </div>
        <div class="hero-foot">
          <p class="lede">
            We’ll write when the first build is ready. Until then, the work can wait.
          </p>
          <div class="signup">
            <p class="signup-label">Back to the beginning</p>
            <p>
              <a class="text-link" href="/">Return to Morrow <span aria-hidden="true">→</span></a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer shell">
      <span>© 2026 Morrow</span>
      <span
        >Built by
        <a class="text-link" href="https://transistorone.com" target="_blank" rel="noreferrer"
          >Transistor One</a
        >
        with love.</span
      >
      <a
        class="text-link"
        href="https://github.com/sahil0x01/t1-morrow/blob/main/LICENSE"
        target="_blank"
        rel="noreferrer"
        >AGPL-3.0 License</a
      >
    </footer>
  </body>
</html>
