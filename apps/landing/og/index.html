<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morrow share card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky: #e9efeb;
        --sky-low: #d6e1d9;
        --ink: #101916;
        --muted: #52635a;
        --dawn: #f2a47d;
        --line: rgba(16, 25, 22, 0.18);
        --display: "Newsreader", "Iowan Old Style", Georgia, serif;
        --body: "Manrope", "Helvetica Neue", sans-serif;
        --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--sky);
      }

      body {
        color: var(--ink);
        font-family: var(--body);
        background:
          radial-gradient(42% 46% at 78% 62%, rgba(242, 164, 125, 0.3), transparent 72%),
          linear-gradient(180deg, var(--sky) 0%, var(--sky) 55%, var(--sky-low) 100%);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.035;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      }

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 42px 64px 38px;
        display: flex;
        flex-direction: column;
      }

      .top {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .top span:first-child {
        font-weight: 500;
      }

      .top span:last-child {
        color: var(--muted);
      }

      .mid {
        margin-top: 84px;
      }

      .eyebrow {
        margin: 0 0 58px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 0 -13px;
        font-family: var(--display);
        font-size: 296px;
        font-weight: 300;
        font-variation-settings: "opsz" 72;
        line-height: 0.72;
        letter-spacing: -0.055em;
        white-space: nowrap;
      }

      .horizon {
        position: relative;
        height: 1px;
        margin-top: 28px;
        background: linear-gradient(
          90deg,
          var(--ink) 0%,
          var(--ink) 7%,
          var(--line) 42%,
          var(--line) 100%
        );
      }

      .glow {
        position: absolute;
        top: -1px;
        left: 0;
        width: 420px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--dawn) 35%, transparent);
        filter: blur(1.5px);
        box-shadow: 0 0 34px 7px rgba(242, 164, 125, 0.3);
      }

      .time {
        position: absolute;
        right: 0;
        top: 9px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 60px;
        margin-top: auto;
      }

      .bottom p {
        margin: 0;
      }

      .description {
        max-width: 700px;
        font-size: 21px;
        line-height: 1.45;
        letter-spacing: -0.01em;
      }

      .meta {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
        padding-bottom: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="top">
        <span>Morrow</span>
        <span>morrow.transistorone.com</span>
      </div>

      <div class="mid">
        <p class="eyebrow">A personal agent with its own computer</p>
        <h1>Morrow</h1>
      </div>

      <div class="horizon">
        <span class="glow"></span>
        <span class="time">06:41</span>
      </div>

      <div class="bottom">
        <p class="description">
          A persistent personal AI assistant that remembers your work and keeps going after you
          close the tab.
        </p>
        <p class="meta">Self-hosted · BYO AI · AGPL-3.0</p>
      </div>
    </main>
  </body>
</html>
